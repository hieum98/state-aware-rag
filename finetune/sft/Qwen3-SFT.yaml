base_model: Qwen/Qwen3-4B-Thinking-2507
# base_model: Qwen/Qwen3-4B
# Automatically upload checkpoint and final model to HF
# hub_model_id: username/custom_model_name

load_in_8bit: false
load_in_4bit: false
strict: false

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

datasets:
  - path: Hieuman/extraction
    type: chat_template
    chat_template: qwen3
    split_thinking: true
special_tokens:
  eos_token: <|im_end|>
  eot_token: <|im_end|>
dataset_prepared_path: data/preprocessed/SFT
val_set_size: 0.0
output_dir: outputs/Extractor-Qwen3-think-SFT/v1

sequence_len: 8192
sample_packing: true
eval_sample_packing: true


adapter: lora
lora_model_dir:
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true

wandb_project: state-aware-rag
wandb_entity: hieuman2708
wandb_name: Qwen3-think-SFT-v3

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 2
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
resume_from_checkpoint:
logging_steps: 1
flash_attention: true

warmup_ratio: 0.1
evals_per_epoch: 4
saves_per_epoch: 1
weight_decay: 0.0

