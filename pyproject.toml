[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "state-aware-rag"
version = "0.1.0"
description = "State-aware multi-hop RAG with MCTS and CoT planners"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "state-aware-rag contributors" }
]
dependencies = [
  "ray",
  "omegaconf",
  "hydra-core",
  "datasets",
  "transformers",
  "tqdm",
  "openai",
  "litellm",
  "pydantic",
  "pebble",
  "requests",
]

[project.urls]
Homepage = "https://github.com/hieum98/state-aware-rag"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "state_aware_rag",
  "state_aware_rag.*",
]
