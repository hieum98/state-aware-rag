[pytest]
addopts = -v --capture=tee-sys
testpaths = langgraph_sar/tests
asyncio_mode = auto
markers =
    live_sglang: requires localhost SGLang tunnels to the SLURM LLM/embedder endpoints
; log_cli = true
; log_cli_level = DEBUG
; log_cli_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
; log_cli_date_format = %H:%M:%S